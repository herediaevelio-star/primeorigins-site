<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Fraunces; src: url(../../fonts/fraunces-normal.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: Fraunces; font-style: italic; src: url(../../fonts/fraunces-italic.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: Inter; src: url(../../fonts/inter-normal.woff2) format("woff2"); font-weight: 100 900; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: radial-gradient(ellipse 60% 70% at 28% 50%, rgba(214,120,40,.32), transparent 70%), #6c1f21;
  color: #f8f1e4; font-family: Inter, sans-serif; position: relative; display: flex; align-items: center; padding: 0 84px; gap: 64px; }
.mark { width: 320px; height: 320px; flex: none; background: #8a2626; border-radius: 48px; display: grid; place-items: center; border: 4px solid #c9a227; }
.mark img { width: 250px; height: 250px; }
.copy { flex: 1; }
.leaf { width: 74px; height: 65px; margin-bottom: 10px; }
h1 { font-family: Fraunces, serif; font-weight: 800; font-size: 84px; line-height: .95; letter-spacing: .03em; text-transform: uppercase; }
.sub { font-size: 22px; letter-spacing: .34em; text-transform: uppercase; margin-top: 14px; color: rgba(248,241,228,.85); display: flex; align-items: center; gap: 16px; }
.sub::before, .sub::after { content: ""; height: 2px; width: 40px; background: #c9a227; }
h2 { font-family: Fraunces, serif; font-style: italic; font-weight: 500; font-size: 42px; color: #c9a227; margin-top: 26px; }
p { font-size: 24px; color: rgba(248,241,228,.85); margin-top: 14px; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: #c9a227; }
.url { position: absolute; right: 84px; top: 40px; font-size: 22px; color: rgba(248,241,228,.65); }
</style></head>
<body>
  <div class="url">primeoriginsco.com</div>
  <div class="mark"><img src="mark-og.svg" alt=""></div>
  <div class="copy">
    <img class="leaf" src="../../leaf.svg" alt="">
    <h1>Prime<br>Origins</h1>
    <div class="sub">Pet Nutrition</div>
    <h2>Real ingredients. Naturally better.</h2>
    <p>100% natural, freeze-dried treats for dogs &amp; cats.</p>
  </div>
  <div class="bar"></div>
</body></html>
