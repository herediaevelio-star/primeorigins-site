<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Fraunces; src: url(../../fonts/fraunces-normal.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: Fraunces; font-style: italic; src: url(../../fonts/fraunces-italic.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: Inter; src: url(../../fonts/inter-normal.woff2) format("woff2"); font-weight: 100 900; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: #3d1f1c; color: #f8f3ea; font-family: Inter, sans-serif; position: relative; display: flex; align-items: center; padding: 0 84px; gap: 64px; }
.mark { width: 340px; height: 340px; flex: none; background: #4b2724; border-radius: 48px; display: grid; place-items: center; }
.mark img { width: 270px; height: 270px; }
.copy { flex: 1; }
.eyebrow { font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: #e2b04a; font-weight: 600; margin-bottom: 22px; }
h1 { font-family: Fraunces, serif; font-weight: 700; font-size: 92px; line-height: .98; letter-spacing: -.02em; }
h2 { font-family: Fraunces, serif; font-style: italic; font-weight: 400; font-size: 48px; color: #f2b8a8; margin-top: 18px; }
p { font-size: 26px; color: rgba(248,243,234,.78); margin-top: 26px; line-height: 1.4; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: linear-gradient(90deg, #b04e4e 0 55%, #e2b04a 55% 80%, #7d8f6a 80%); }
.url { position: absolute; right: 84px; top: 46px; font-size: 22px; color: rgba(248,243,234,.6); letter-spacing: .02em; }
</style></head>
<body>
  <div class="url">primeoriginsco.com</div>
  <div class="mark"><img src="mark-og.svg" alt=""></div>
  <div class="copy">
    <div class="eyebrow">Freeze-dried pet treats</div>
    <h1>Prime Origins</h1>
    <h2>One ingredient. Nothing else.</h2>
    <p>Single-ingredient, organic treats<br>for dogs &amp; cats.</p>
  </div>
  <div class="bar"></div>
</body></html>
