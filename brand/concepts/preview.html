<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logo Concepts</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  body { margin: 0; padding: 32px; font-family: Inter, sans-serif; background: #f6f0e4; color: #1d1d1b; }
  h2 { font-family: Fraunces, serif; margin: 0 0 4px; color: #1f3a2b; }
  .row { display: grid; grid-template-columns: 220px 220px 1fr; gap: 24px; align-items: center; margin-bottom: 36px; }
  .tile { width: 220px; height: 220px; border-radius: 20px; display: grid; place-items: center; }
  .light { background: #fffdf8; border: 1px solid #e3dccd; }
  .dark { background: #1f3a2b; }
  .tile svg { width: 160px; height: 160px; }
  .meta { display: flex; flex-direction: column; gap: 14px; }
  .lockup { display: flex; align-items: center; gap: 10px; background: #fffdf8; padding: 12px 16px; border-radius: 12px; width: max-content; }
  .lockup svg { width: 40px; height: 40px; }
  .lockup span { font-family: Fraunces, serif; font-weight: 700; font-size: 24px; color: #1f3a2b; }
  .small { display: flex; gap: 14px; align-items: center; }
  .small svg { width: 32px; height: 32px; } .small svg.s16 { width: 16px; height: 16px; }
  p { margin: 0; color: #5d5a52; font-size: 14px; max-width: 420px; }
</style>
</head>
<body>
<div id="sheet"></div>
<script src="concepts.js"></script>
<script>
// Each concept is defined once and rendered in every context.

const sheet = document.getElementById('sheet');
for (const c of concepts) {
  const light = c.svg(C.F, '#fffdf8', C.K), dark = c.svg(C.S, C.F, C.K);
  sheet.insertAdjacentHTML('beforeend', `
    <div class="row" id="${c.id}">
      <div class="tile light">${light}</div>
      <div class="tile dark">${dark}</div>
      <div class="meta"><h2>${c.name}</h2><p>${c.note}</p>
        <div class="lockup">${c.svg(C.F, '#fffdf8', C.K)}<span>Prime Origins</span></div>
        <div class="small">${c.svg(C.F, '#fffdf8', C.K)}${c.svg(C.F, '#fffdf8', C.K).replace('<svg', '<svg class="s16"')} <p>32px / 16px favicon</p></div>
      </div>
    </div>`);
}
</script>
</body>
</html>
