<!doctype html><html><head><meta charset="utf-8"><title>Logo check</title>
<style>body{margin:0;padding:24px;font-family:sans-serif;background:#ddd}.r{display:flex;gap:16px;margin-bottom:16px;align-items:center}
.b{width:150px;height:150px;display:grid;place-items:center;border-radius:12px}.b img{width:120px}
.f img{image-rendering:auto}</style></head><body>
<div class="r">
<div class="b" style="background:#fff"><img src="../logo-v2-mark.svg"></div>
<div class="b" style="background:#f6f0e4"><img src="../logo-v2-mark.svg"></div>
<div class="b" style="background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/16px 16px"><img src="../logo-v2-mark.svg"></div>
<div class="b" style="background:#1d1d1b"><img src="../logo-v2-mark-reversed.svg"></div>
<div class="b" style="background:#1f3a2b"><img src="../logo-v2-mark-reversed.svg"></div>
</div>
<div class="r f" style="background:#fff;padding:12px;border-radius:12px;width:max-content">
<img src="../logo-v2-favicon.svg" width="128"><img src="../logo-v2-favicon.svg" width="64"><img src="../logo-v2-favicon.svg" width="32"><img src="../logo-v2-favicon.svg" width="16">
<span style="margin-left:24px">v1 for reference:</span><img src="../logo-v1-leaf.svg" width="32"><img src="../logo-v1-leaf.svg" width="16">
</div></body></html>
